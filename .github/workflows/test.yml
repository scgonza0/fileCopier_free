name: Tests multiplataforma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-shape0 libxcb-sync1 libxcb-xkb1 libglib2.0-0 \
            libfontconfig1 libdbus-1-3 libx11-xcb1 libx11-6 libsm6 \
            libice6 libxtst6 libxi6 libegl1-mesa-dev mesa-common-dev \
            libxrender1 libxext6 libx11-xcb-dev libxcb-glx0 libxcb-util1

      - name: Run tests (headless)
        env:
          FC_LANG: es
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_app.py -v
